name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Project validator (docs / registry / consistency)
        run: python tools/validate_project.py

      - name: UE scaffold validator (M0 project structure)
        run: python tools/validate_unreal_scaffold.py
